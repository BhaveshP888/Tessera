<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save to Tessera</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111a2e;
      --surface-hover: #16223b;
      --border: rgba(148, 163, 184, 0.16);
      --border-focus: #38bdf8;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --teal: #38bdf8;
      --teal-dim: rgba(56, 189, 248, 0.15);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.15);
      --green: #10b981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .brand-wrap { display: flex; align-items: center; gap: 7px; }
    .brand-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--teal), #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: #030712;
    }
    .brand { font-weight: 700; font-size: 14px; color: var(--text); letter-spacing: -0.2px; }
    .badge {
      font-size: 9px;
      font-family: monospace;
      background: var(--teal-dim);
      color: var(--teal);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .form-group { margin-bottom: 11px; }
    label {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
      font-weight: 500;
    }
    input, textarea, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--border-focus);
      background: var(--surface-hover);
    }
    select option {
      background: #111a2e;
      color: #f1f5f9;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .btn-primary {
      background: var(--teal);
      color: #031020;
    }
    .btn-primary:hover {
      background: #7dd3fc;
    }
    .btn-vault {
      background: var(--amber-dim);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .btn-vault:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--amber);
    }
    .status {
      margin-top: 10px;
      padding: 7px 10px;
      border-radius: 5px;
      font-size: 11.5px;
      text-align: center;
      display: none;
    }
    .status-library {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-vault {
      background: var(--amber-dim);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    #custom-col-wrap {
      display: none;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-wrap">
      <div class="brand-icon">T</div>
      <span class="brand">Tessera</span>
    </div>
    <span class="badge">E2E ENCRYPTED</span>
  </div>

  <form id="save-form">
    <div class="form-group">
      <label for="url">URL *</label>
      <input type="url" id="url" required />
    </div>

    <div class="form-group">
      <label for="title">Title *</label>
      <input type="text" id="title" required />
    </div>

    <div class="form-group">
      <label for="collection">Collection</label>
      <select id="collection">
        <option value="">None (General Library)</option>
        <option value="System Design">System Design</option>
        <option value="Cryptography">Cryptography</option>
        <option value="Research">Research</option>
        <option value="Tools">Tools</option>
        <option value="Reading">Reading</option>
        <option value="__new__">+ New collection...</option>
      </select>
      <div id="custom-col-wrap">
        <input type="text" id="custom-collection" placeholder="Type new collection name..." />
      </div>
    </div>

    <div class="form-group">
      <label for="tags">Tags (comma separated)</label>
      <input type="text" id="tags" placeholder="privacy, docs, tools" />
    </div>

    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea id="notes" rows="2" placeholder="Private note..."></textarea>
    </div>

    <div class="actions-grid">
      <button type="button" id="btn-save-library" class="btn btn-primary">
        <span>Save to Library</span>
      </button>
      <button type="button" id="btn-save-vault" class="btn btn-vault">
        <span>🔒 Add to Vault</span>
      </button>
    </div>
  </form>

  <div id="status" class="status"></div>

  <script type="module" src="src/popup.ts"></script>
</body>
</html>
